# Publica la app en GitHub Pages (HTTPS), necesario para usar el modo VR desde las gafas sin cable.
# Actívalo en GitHub: Settings › Pages › Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Descargar Three.js y generar index.html
        run: bash setup.sh
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html vendor plano proyectos _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
